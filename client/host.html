<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Host Panel — Devil's Advocate</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./css/crypt.css">
  <link rel="stylesheet" href="./css/game.css">
</head>
<body>

  <nav class="site-nav">
    <div class="nav-inner">
      <a href="./index.html" class="nav-brand">Devil's Advocate</a>
      <ul class="nav-links">
        <li><a href="./host.html" class="active">Host</a></li>
      </ul>
    </div>
  </nav>

  <main class="game-main host-main">

    <header class="host-head">
      <div>
        <h1>Host</h1>
        <p class="session-line" id="session-line">No session running</p>
      </div>
      <div class="host-status">
        <span class="status-pill" data-status="offline" id="connection-pill">Offline</span>
        <span class="phase-pill" id="phase-pill">No round</span>
      </div>
    </header>

    <ol class="stepper" id="stepper" aria-label="Show progress"></ol>

    <!-- The one thing to do right now. -->
    <section class="card card-gold now-card" id="now-card">
      <div class="now-eyebrow" id="now-step"></div>
      <h2 id="now-title">Start a session</h2>
      <p id="now-blurb"></p>
      <p class="now-audience" id="now-audience" hidden></p>

      <div class="invite-list" id="now-invites" hidden></div>

      <div class="now-timer" id="now-timer" hidden>
        <div class="field-label" id="now-timer-label">Timer</div>
        <div class="timer-display" id="timer-display">--:--</div>
        <button class="btn btn-ghost" id="btn-timer-toggle" type="button">Start timer</button>
      </div>

      <div class="now-inputs" id="now-inputs"></div>

      <div class="now-actions">
        <button class="btn btn-gold btn-primary" id="btn-primary" type="button">Start a session</button>
        <p class="now-hint" id="now-hint"></p>
        <button class="link-btn" id="btn-skip-wait" type="button" hidden>Start without waiting</button>
      </div>
      <p class="now-error" id="now-error" role="alert" hidden></p>
    </section>

    <!-- What the host can see that the audience can't (yet). -->
    <section class="card" id="table-card" hidden>
      <div class="table-head">
        <div class="field-label">On the table</div>
        <span class="badge" id="table-visibility"></span>
      </div>
      <h3 class="table-prompt" id="table-prompt"></h3>
      <p class="table-explainer" id="table-explainer"></p>
      <ul class="table-sides" id="table-sides"></ul>
    </section>

    <section class="card">
      <div class="field-label">Show links</div>
      <div class="control-group">
        <button class="btn btn-ghost" id="btn-copy-overlay" type="button">Copy OBS overlay link</button>
        <button class="btn btn-ghost" id="btn-copy-watch" type="button">Copy audience link</button>
      </div>
      <div class="invite-list" id="links-invites"></div>
    </section>

    <details class="card more">
      <summary>More controls</summary>
      <div class="control-group">
        <button class="btn btn-ghost" id="btn-back" type="button">◂ Back one phase</button>
        <button class="btn btn-ghost" id="btn-hide" type="button">Emergency hide overlay</button>
      </div>
      <div class="control-group">
        <button class="btn btn-accent" id="btn-void" type="button">Void this round</button>
        <button class="btn btn-accent" id="btn-reroll" type="button">Clear poll results</button>
        <button class="btn btn-ghost" id="btn-forget" type="button">Forget this session on this browser</button>
      </div>
    </details>

    <details class="card">
      <summary>Event log</summary>
      <ul class="event-log" id="event-log">
        <li>Nothing yet.</li>
      </ul>
    </details>
  </main>

  <script type="module" src="./js/host.js"></script>

</body>
</html>
