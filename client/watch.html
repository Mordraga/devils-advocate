<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch — Devil's Advocate</title>
  <meta name="description" content="Follow the debate live: topic, sides, timer, and audience sway.">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./css/crypt.css">
  <link rel="stylesheet" href="./css/game.css">
  <link rel="icon" type="image/png" href="./assets/favicon.png">

</head>
<body>

  <nav class="site-nav">
    <div class="nav-inner">
      <a href="./index.html" class="nav-brand">Devil's Advocate</a>
      <div class="nav-right">
        <span class="room-code" id="room-code" hidden></span>
        <button class="sound-toggle" id="sound-toggle" type="button" aria-pressed="false">Enable sound</button>
        <span class="status-pill" data-status="offline" id="connection-pill">Offline</span>
      </div>
    </div>
  </nav>

  <!-- Mirrors overlay.html (spec section 5.D) and is driven by the same
       overlay.js renderer — same element ids, just with visible nav/footer
       and no transparency, since this isn't an OBS browser source. -->
  <main class="game-main overlay-frame" id="overlay-frame">

    <!-- Audience voting: two big buttons while a poll is open. -->
    <section class="card card-gold vote-card" id="vote-card" hidden>
      <div class="field-label" id="vote-kicker">Vote now</div>
      <h2 id="vote-question">Which side are you on?</h2>
      <p class="vote-topic" id="vote-topic"></p>
      <p class="topic-explainer" id="vote-explainer"></p>
      <div class="vote-buttons">
        <button class="vote-btn" id="vote-a" type="button" aria-pressed="false">
          <span class="vote-side" id="vote-a-text">—</span>
          <span class="vote-by" id="vote-a-by"></span>
        </button>
        <button class="vote-btn" id="vote-b" type="button" aria-pressed="false">
          <span class="vote-side" id="vote-b-text">—</span>
          <span class="vote-by" id="vote-b-by"></span>
        </button>
      </div>
      <p class="vote-status" id="vote-status" role="status"></p>
    </section>

    <div id="overlay-standby">
      <svg class="cauldron" viewBox="0 0 200 190" role="img" aria-label="A bubbling cauldron">
        <defs>
          <radialGradient id="brew" cx="50%" cy="50%" r="60%">
            <stop offset="0" stop-color="#e8d49a"/>
            <stop offset="0.55" stop-color="#c9a84c"/>
            <stop offset="1" stop-color="#8b1a1a"/>
          </radialGradient>
        </defs>
        <g class="steam" fill="none" stroke-linecap="round">
          <path d="M72 66 q-12 -14 0 -28 q12 -14 0 -30"/>
          <path d="M100 62 q-12 -14 0 -28 q12 -14 0 -30"/>
          <path d="M128 66 q-12 -14 0 -28 q12 -14 0 -30"/>
        </g>
        <path class="legs" d="M62 170 l-9 16 M138 170 l9 16" fill="none" stroke-linecap="round"/>
        <path class="pot" d="M40 84 C30 150 60 178 100 178 C140 178 170 150 160 84 Z"/>
        <ellipse class="brew" cx="100" cy="84" rx="60" ry="14" fill="url(#brew)"/>
        <ellipse class="rim" cx="100" cy="84" rx="62" ry="15" fill="none"/>
        <g class="bubbles">
          <circle cx="78" cy="84" r="5"/>
          <circle cx="98" cy="86" r="4"/>
          <circle cx="118" cy="83" r="6"/>
          <circle cx="132" cy="86" r="3.5"/>
          <circle cx="66" cy="86" r="3"/>
        </g>
      </svg>
      <div class="page-hero-sigil">⸸ ✦ ⸸</div>
      <h2>The Cauldron Simmers</h2>
      <p id="overlay-roster"></p>
      <p class="join-line" id="overlay-join"></p>
      <p>No round is live right now.</p>
    </div>

    <div id="overlay-topic" hidden>
      <span class="seal" aria-hidden="true">⸸</span>
      <h3>Tonight's Topic</h3>
      <h1 id="overlay-topic-prompt">—</h1>
      <p class="topic-explainer" id="overlay-topic-explainer"></p>
    </div>

    <div id="overlay-sides" class="stance-grid" hidden>
      <div class="stance-card card card-accent">
        <div class="stance-side">Side A</div>
        <div class="stance-position" id="overlay-side-a">—</div>
        <div class="contestant-name" id="overlay-contestant-a">—</div>
      </div>
      <div class="stance-card card card-gold">
        <div class="stance-side">Side B</div>
        <div class="stance-position" id="overlay-side-b">—</div>
        <div class="contestant-name" id="overlay-contestant-b">—</div>
      </div>
    </div>

    <div id="overlay-timer" hidden>
      <h3 id="overlay-phase-label">Preparation</h3>
      <div class="timer-display" id="overlay-timer-display">--:--</div>
    </div>

    <div id="overlay-split" hidden>
      <p id="overlay-split-text"></p>
    </div>

    <div id="overlay-results" hidden>
      <h3 id="overlay-results-label">Winner</h3>
      <h1 id="overlay-winner">—</h1>
      <p id="overlay-sway"></p>
    </div>

  </main>

  <footer class="site-footer">
    <div class="bar"></div>
    <div class="footer-links">
      <a href="https://mordraga.me/">Home</a>
      <a href="https://mordraga.me/connect/">Connect</a>
    </div>
    <div class="footer-copy">The Crypt · Devil's Advocate · ©2026</div>
  </footer>

  <script type="module" src="./js/overlay.js"></script>
  <script type="module" src="./js/watch.js"></script>

</body>
</html>
